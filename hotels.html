<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HotelBook — Hotels</title><link rel="stylesheet" href="style.css"></head>
<body><div class="site">
<header><a class="logo" href="index.html">HotelBook</a><nav><a href="index.html">Home</a><a href="hotels.html">Hotels</a><a href="about.html">About Us</a><a href="contact.html">Contact</a><a class="btn" href="booking.html">Book Now</a></nav></header>
<main>
<div class="page-heading"><h1 class="page-title">Available Hotels</h1><p class="subtitle">Find the best places to stay for your next trip.</p></div>
<div class="hotels-layout">
<aside class="panel">
<h3>Filters</h3>
<form id="filter-form">
<div class="field"><label for="search-input">Destination or hotel</label><input id="search-input" type="search" placeholder="Enter a city or hotel"></div>
<p><strong>Price per night</strong></p>
<div class="checkbox-group">
<label><input type="checkbox" name="price" value="0-50"> $0 - $50</label>
<label><input type="checkbox" name="price" value="50-100"> $50 - $100</label>
<label><input type="checkbox" name="price" value="100-200"> $100 - $200</label>
<label><input type="checkbox" name="price" value="200-Infinity"> $200+</label>
</div>
<p><strong>Rating</strong></p>
<div class="checkbox-group">
<label><input type="checkbox" name="rating" value="5"> 5 stars</label>
<label><input type="checkbox" name="rating" value="4"> 4+ stars</label>
<label><input type="checkbox" name="rating" value="3"> 3+ stars</label>
</div>
<p><strong>Amenities</strong></p>
<div class="checkbox-group" id="amenity-filters"></div>
<button type="button" id="reset-filters" class="hidden">Reset filters</button>
</form>
<div class="favorites-panel" id="favorites-panel"></div>
</aside>
<section>
<div class="results-bar">
<p class="muted" id="results-count" aria-live="polite">Loading hotels...</p>
<div class="sort-field">
<label for="sort-select">Sort by</label>
<select id="sort-select">
<option value="default">Recommended</option>
<option value="price-asc">Price: low to high</option>
<option value="price-desc">Price: high to low</option>
<option value="rating-desc">Rating: high to low</option>
</select>
</div>
</div>
<div class="hotel-list" id="hotel-list"></div>
</section>
</div>
</main>
<footer><strong>HotelBook</strong><span>info@hotelbook.com | +7 700 667 5637</span><span><a href="sitemap.html">Sitemap</a> | <a href="project-description.html">Project Description</a></span><span>© 2026 HotelBook. All rights reserved.</span></footer>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/main.js"></script>
<script src="js/hotels.js"></script>
<script src="js/effects.js"></script>
</body></html>
